<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements - SIWES Hub</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/icons.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page-content">
        <div class="page-head">
          <div>
            <h2>Announcements</h2>
            <p>Notices from the SIWES office - targeted to everyone, students or supervisors.</p>
          </div>
          <button class="btn btn-primary" id="newAnnouncementBtn" style="display:none">
            <i data-lucide="megaphone"></i>New announcement
          </button>
        </div>

        <div class="filter-row">
          <select id="audienceFilter" style="display:none">
            <option value="">All audiences</option>
            <option value="all">Everyone</option>
            <option value="students">Students only</option>
            <option value="supervisors">Supervisors only</option>
          </select>
        </div>

        <div id="announcementsList" class="stack"></div>
        <div id="announcementsPager"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/announcements.js"></script>
  <script>window.addEventListener("load", initAnnouncementsPage);</script>
</body>
</html>
