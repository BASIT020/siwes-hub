<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Logs - SIWES Hub</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/icons.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page-content">
        <div class="page-head">
          <div>
            <h2>Daily Logs</h2>
            <p>Students record each day's activities; supervisors review them.</p>
          </div>
          <button class="btn btn-primary" id="newLogBtn"><i data-lucide="plus"></i>New daily log</button>
        </div>

        <div class="filter-row">
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="draft">Draft</option>
            <option value="submitted">Awaiting review</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>

        <div id="logsList" class="stack"></div>
        <div id="logsPager"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/logs.js"></script>
  <script>window.addEventListener("load", initLogsPage);</script>
</body>
</html>
