<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizations - SIWES Hub</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/icons.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page-content">
        <div class="page-head">
          <div>
            <h2>Organizations</h2>
            <p>Host organizations accepting students for industrial training.</p>
          </div>
          <button class="btn btn-primary" id="newOrganizationBtn">
            <i data-lucide="plus"></i>Add organization
          </button>
        </div>

        <div class="filter-row">
          <input type="search" id="organizationsSearch" class="grow" placeholder="Search by name, industry or address...">
          <select id="organizationsActiveFilter">
            <option value="">Active + deactivated</option>
            <option value="true">Active only</option>
            <option value="false">Deactivated only</option>
          </select>
        </div>

        <div id="organizationsList"></div>
        <div id="organizationsPager"></div>

        <!-- SIWES sessions (administrator only) -->
        <div class="card mt-3">
          <div class="page-head" style="margin-bottom:1rem">
            <div>
              <h2 style="font-size:1.2rem; margin:0">SIWES Sessions</h2>
              <p style="margin:0.2rem 0 0">Academic periods (e.g. 2025/2026 Rain) that group placements together.</p>
            </div>
            <button class="btn btn-outline" id="newSessionBtn"><i data-lucide="plus"></i>New session</button>
          </div>
          <div id="sessionsList"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/organizations.js"></script>
  <script>window.addEventListener("load", initOrganizationsPage);</script>
</body>
</html>
