<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - SIWES Hub</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/icons.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page-content">
        <div class="page-head">
          <div>
            <h2>Attendance</h2>
            <p>Supervisors record daily attendance; rates are computed live from the records.</p>
          </div>
          <button class="btn btn-primary" id="recordAttendanceBtn"><i data-lucide="calendar-plus"></i>Record attendance</button>
        </div>

        <div id="attendanceSummary"></div>

        <div class="filter-row">
          <input type="date" id="attendanceDateFilter" title="Filter by exact date">
          <select id="attendanceStatusFilter">
            <option value="">All statuses</option>
            <option value="present">Present</option>
            <option value="late">Late</option>
            <option value="absent">Absent</option>
            <option value="excused">Excused</option>
          </select>
          <select id="attendanceStudentFilter" class="grow" style="display:none">
            <option value="">All students</option>
          </select>
        </div>

        <div id="attendanceList"></div>
        <div id="attendancePager"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/attendance.js"></script>
  <script>window.addEventListener("load", initAttendancePage);</script>
</body>
</html>
