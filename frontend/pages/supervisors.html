<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisors - SIWES Hub</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/icons.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page-content">
        <div class="page-head">
          <div>
            <h2>Supervisors</h2>
            <p>Institution supervisors who review student logs, reports and projects.</p>
          </div>
          <button class="btn btn-primary" id="newSupervisorBtn">
            <i data-lucide="user-plus"></i>Register supervisor
          </button>
        </div>

        <section id="pendingApprovals" class="pending-banner" style="display:none">
          <i data-lucide="user-cog"></i>
          <div id="pendingApprovalsBody"></div>
        </section>

        <div class="filter-row">
          <input type="search" id="supervisorsSearch" class="grow" placeholder="Search by name or department...">
          <select id="supervisorsStatus" aria-label="Filter by account status">
            <option value="">All statuses</option>
            <option value="pending">Pending approval</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="inactive">Deactivated</option>
          </select>
        </div>

        <div id="supervisorsList"></div>
        <div id="supervisorsPager"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/supervisors.js"></script>
  <script>window.addEventListener("load", initSupervisorsPage);</script>
</body>
</html>
